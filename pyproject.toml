[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "streamlit-lonboard"
version = "0.1.0.dev0"
description = "Streamlit component for lonboard: fast GeoArrow/deck.gl maps without GeoJSON"
readme = "README.md"
license = "MIT"
# <3.14: current pyarrow (25.0.0, see the pyarrow<20 note below) has no wheels
# for cp314 and fails to build from source without a full C++ toolchain, so
# 3.14 forces you onto the exact pyarrow release this project avoids.
requires-python = ">=3.10,<3.14"
authors = [{ name = "Tobias Hoelzer" }]
keywords = ["streamlit", "lonboard", "deckgl", "geoarrow", "geospatial"]
dependencies = [
    # Phase 0 spike: CCv2 as used here (st.components.v2, bidi_component data=bytes)
    # verified against streamlit==1.59.2. Older 1.49-1.58 may work but are untested.
    "streamlit>=1.59",
    "lonboard>=0.10",
    # <20: pyarrow 25.0.0 (the only build available for Python 3.14, and also
    # what a plain `pyarrow>=14` resolves to on 3.10-3.13) has an intermittent
    # native segfault in its pandas/GeoDataFrame-to-Arrow conversion path
    # (pa.Table.from_pandas, reached via lonboard's geopandas_to_geoarrow)
    # when called from a background thread - which is exactly how Streamlit
    # runs every script (ScriptRunner thread) alongside its file-watcher
    # threads. It's racy, not deterministic: reproduced on the very first
    # render in some runs, only after several reruns (e.g. triggered by
    # panning with return_view_state=True) in others. Confirmed pyarrow
    # 19.0.1 does not exhibit it across 100+ stress-test reruns; versions
    # 20-24 are untested and not assumed safe.
    "pyarrow>=14,<20",
]

[project.optional-dependencies]
dev = ["pytest", "geopandas", "ruff"]

[project.urls]
Repository = "https://github.com/relativityhd/streamlit-lonboard"
Issues = "https://github.com/relativityhd/streamlit-lonboard/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/streamlit_lonboard"]
# frontend_dist/ is gitignored (it's a build artifact - see hatch_build.py), so
# hatchling's default VCS-aware file selection excludes it; `artifacts` forces
# it back in despite that.
artifacts = ["src/streamlit_lonboard/frontend_dist/**"]

# Builds frontend/ into src/streamlit_lonboard/frontend_dist/ automatically
# for `uv build`/`uv sync`/`pip install [-e] .` - see hatch_build.py.
[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"

# Also mirrored in src/streamlit_lonboard/pyproject.toml - see the comment
# there for why (CCv2's manifest scanner can't see this file for a src/ layout).
[tool.streamlit.component]
components = [{ name = "lonboard_map", asset_dir = "frontend_dist" }]
